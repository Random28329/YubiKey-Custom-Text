<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store text on YubiKey (FIDO2 passkey)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input { width: 100%; padding: 10px; font-size: 16px; font-family: ui-monospace, monospace; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
  #out { margin-top: 20px; padding: 12px; background: #f2f2f2; white-space: pre-wrap; font-family: ui-monospace, monospace; word-break: break-all; }
  .site { font-family: ui-monospace, monospace; background: #fff3c4; padding: 2px 6px; }
  small { color: #666; }
</style>
</head>
<body>
<h1>Store text on YubiKey</h1>
<p>Passkey site name: <span class="site" id="site"></span><br>
<small>This is what Yubico Authenticator will show. Reading back only works from this exact name.</small></p>

<label for="secret">Text to store</label>
<input id="secret" autocomplete="off" spellcheck="false" placeholder="A3-XXXXXX-XXXXXX-XXXXX-XXXXX-XXXXX-XXXXX">
<small id="len">0 / 64 bytes</small>

<label for="rpname">Label (friendly name, may not be shown)</label>
<input id="rpname" value="1Password Secret Key">

<button id="create">1. Write to YubiKey</button>
<button id="read">2. Read back from YubiKey</button>

<div id="out">Ready.</div>

<script>
const $ = id => document.getElementById(id);
const enc = new TextEncoder();
const out = msg => $("out").textContent = msg;
const host = location.hostname;
const okHost = host === "localhost" || host.endsWith(".localhost");

$("site").textContent = host || "(opened as a file)";
if (!okHost) out("Start this page with start.bat - it must open at http://<name>.localhost:8000");

$("secret").addEventListener("input", () => {
  $("len").textContent = enc.encode($("secret").value.trim()).length + " / 64 bytes";
});

$("create").onclick = async () => {
  const text = $("secret").value.trim();
  const bytes = enc.encode(text);
  if (!okHost) return out("Start this page with start.bat.");
  if (!text) return out("Enter some text first.");
  if (bytes.length > 64) return out("Too long: " + bytes.length + " bytes (max 64).");

  try {
    out("Follow the browser / Windows prompts: insert key, enter PIN, touch key...");
    await navigator.credentials.create({
      publicKey: {
        rp: { id: host, name: $("rpname").value || "Stored text" },
        user: { id: bytes, name: text, displayName: text },
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -8 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: {
          authenticatorAttachment: "cross-platform",
          residentKey: "required",
          requireResidentKey: true,
          userVerification: "required"
        },
        hints: ["security-key"],
        attestation: "none",
        timeout: 120000
      }
    });
    $("secret").value = "";
    $("len").textContent = "0 / 64 bytes";
    out("Done. Saved to the YubiKey under:\n" + host +
        "\n\nClick 'Read back' to check it, or look in Yubico Authenticator > Passkeys.");
  } catch (e) {
    out("Failed: " + e.name + " - " + e.message);
  }
};

$("read").onclick = async () => {
  if (!okHost) return out("Start this page with start.bat.");
  try {
    out("Insert key, enter PIN, touch key...");
    const cred = await navigator.credentials.get({
      publicKey: {
        rpId: host,
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        userVerification: "required",
        hints: ["security-key"],
        timeout: 120000
      }
    });
    const handle = cred.response.userHandle;
    out(handle ? "Stored text:\n\n" + new TextDecoder().decode(handle) : "No user handle returned.");
  } catch (e) {
    out("Failed: " + e.name + " - " + e.message);
  }
};
</script>
</body>
</html>
